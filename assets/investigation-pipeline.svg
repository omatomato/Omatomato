<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="235" viewBox="0 0 1100 235" role="img" aria-labelledby="title desc">
  <title id="title">Investigation workflow</title><desc id="desc">Ingest sources, preserve integrity, correlate a timeline, challenge alternatives and report limits and actions.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#090908"/><stop offset="1" stop-color="#15130f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <rect x="1" y="1" width="1098" height="233" rx="18" fill="url(#bg)" stroke="#35312a" stroke-width="2"/>
  <text x="34" y="38" fill="#777166" font-family="'Courier New',monospace" font-size="11" letter-spacing="3">EVIDENCE-LED WORKFLOW / FINITE STATES</text>
  <path id="route" d="M105 112H995" fill="none" stroke="#3d3830" stroke-width="3"/>
  <path d="M105 112H995" fill="none" stroke="#ff4d00" stroke-width="2" stroke-dasharray="5 18" opacity=".55">
    <animate attributeName="stroke-dashoffset" values="0;-46" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle r="6" fill="#ff4d00" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g transform="translate(105 112)"><circle r="34" fill="#11110f" stroke="#ff4d00" stroke-width="2"/><text y="5" fill="#f1ebdd" font-size="13" font-weight="700">INGEST</text><text y="64" fill="#777166" font-size="11">sources / context</text></g>
    <g transform="translate(328 112)"><circle r="34" fill="#11110f" stroke="#6b6358" stroke-width="2"/><text y="5" fill="#f1ebdd" font-size="13" font-weight="700">PRESERVE</text><text y="64" fill="#777166" font-size="11">integrity / hashes</text></g>
    <g transform="translate(550 112)"><circle r="34" fill="#11110f" stroke="#6b6358" stroke-width="2"/><text y="5" fill="#f1ebdd" font-size="13" font-weight="700">CORRELATE</text><text y="64" fill="#777166" font-size="11">timeline / entities</text></g>
    <g transform="translate(772 112)"><circle r="34" fill="#11110f" stroke="#6b6358" stroke-width="2"/><text y="5" fill="#f1ebdd" font-size="13" font-weight="700">CHALLENGE</text><text y="64" fill="#777166" font-size="11">alternatives / confidence</text></g>
    <g transform="translate(995 112)"><circle r="34" fill="#11110f" stroke="#f1ebdd" stroke-width="2"/><text y="5" fill="#f1ebdd" font-size="13" font-weight="700">REPORT</text><text y="64" fill="#777166" font-size="11">limits / actions</text></g>
  </g>
  <text x="34" y="214" fill="#ff4d00" font-family="'Courier New',monospace" font-size="10" letter-spacing="2">FACT ≠ INFERENCE</text><text x="1066" y="214" text-anchor="end" fill="#777166" font-family="'Courier New',monospace" font-size="10" letter-spacing="2">AUDITABLE OUTPUT</text>
</svg>
