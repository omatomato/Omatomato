<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Public operations surface</title>
  <desc id="desc">Status board for the Field Lab, Case Archive, Cybersec Lab, Evidence Tools, Field Notes and Trust Center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090908"/><stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#282620" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="1" y="1" width="1098" height="388" rx="18" fill="url(#bg)" stroke="#35312a" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="388" rx="18" fill="url(#grid)" opacity=".38"/>
  <text x="36" y="42" fill="#ff4d00" font-family="'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="4">PUBLIC OPERATIONS / STATUS BOARD</text>
  <text x="1064" y="42" fill="#777166" text-anchor="end" font-family="'Courier New',monospace" font-size="11" letter-spacing="2">6 SURFACES</text>
  <path d="M36 60H1064" stroke="#35312a"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(36 82)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#ff4d00"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">FIELD LAB</text>
      <rect x="244" y="14" width="62" height="24" rx="12" fill="#ff4d00" opacity=".15"/>
      <text x="275" y="30" fill="#ff6a2b" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">LIVE</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">Public portfolio, secure contact</text>
      <text x="20" y="87" fill="#777166" font-size="12">and operational resources.</text>
    </g>
    <g transform="translate(387 82)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#e5a400"><animate attributeName="opacity" values=".4;1;.4" dur="2.1s" begin=".3s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">CASE ARCHIVE</text>
      <rect x="218" y="14" width="88" height="24" rx="12" fill="#e5a400" opacity=".13"/>
      <text x="262" y="30" fill="#e9b83e" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">REDACTED</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">Evidence-led public cases</text>
      <text x="20" y="87" fill="#777166" font-size="12">with confidence and limitations.</text>
    </g>
    <g transform="translate(738 82)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#3ca0ff"><animate attributeName="opacity" values=".35;1;.35" dur="1.7s" begin=".6s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">CYBERSEC LAB</text>
      <rect x="238" y="14" width="68" height="24" rx="12" fill="#3ca0ff" opacity=".13"/>
      <text x="272" y="30" fill="#65b4ff" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">ACTIVE</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">IOC triage, threat models</text>
      <text x="20" y="87" fill="#777166" font-size="12">and defensive research.</text>
    </g>
    <g transform="translate(36 224)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#b28cff"><animate attributeName="opacity" values=".35;1;.35" dur="2s" begin=".9s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">EVIDENCE TOOLS</text>
      <rect x="211" y="14" width="95" height="24" rx="12" fill="#b28cff" opacity=".13"/>
      <text x="258" y="30" fill="#c5a8ff" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">LOCAL-FIRST</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">Browser-side evidence utilities</text>
      <text x="20" y="87" fill="#777166" font-size="12">without silent file uploads.</text>
    </g>
    <g transform="translate(387 224)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#62c48d"><animate attributeName="opacity" values=".35;1;.35" dur="1.9s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">FIELD NOTES</text>
      <rect x="240" y="14" width="66" height="24" rx="12" fill="#62c48d" opacity=".13"/>
      <text x="273" y="30" fill="#79d8a2" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">PUBLIC</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">Technical writing on evidence,</text>
      <text x="20" y="87" fill="#777166" font-size="12">attribution and response.</text>
    </g>
    <g transform="translate(738 224)">
      <rect width="326" height="118" rx="12" fill="#11110f" stroke="#3d3830"/>
      <circle cx="24" cy="25" r="5" fill="#f1ebdd"><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text x="42" y="30" fill="#f1ebdd" font-size="18" font-weight="700">TRUST CENTER</text>
      <rect x="224" y="14" width="82" height="24" rx="12" fill="#f1ebdd" opacity=".09"/>
      <text x="265" y="30" fill="#f1ebdd" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">VERIFIED</text>
      <text x="20" y="66" fill="#aaa49a" font-size="13">PGP identity, disclosure policy</text>
      <text x="20" y="87" fill="#777166" font-size="12">and verification instructions.</text>
    </g>
  </g>
  <circle cx="1070" cy="365" r="4" fill="#ff4d00" opacity=".25" filter="url(#glow)"/>
</svg>
