name: Update TryHackMe badge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-tryhackme-badge.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tryhackme-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate badge from public TryHackMe data
        uses: KeizerSec/Tryhackme-Badge@6c1d385b51650c3aeed73f0428dd09d9301f3f0b
        with:
          username: omato
          output_path: assets/thm_badge.svg
          theme: inferno
          accent_color: "#ff4d00"
          commit_message: "chore: refresh TryHackMe badge"
